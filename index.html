<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Task Board">
<title>Task Board</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root {
  --accent: #0d9488;
  --accent-soft: rgba(13, 148, 136, 0.13);
  --bg: #faf8f4;
  --card: #ffffff;
  --panel: #f1efe9;
  --panel-strong: #eae7df;
  --text: #22211e;
  --muted: #7a776e;
  --line: rgba(34, 33, 30, 0.1);
  --danger: #dc4444;
  --shadow-card: 0 1px 2px rgba(34, 33, 30, 0.06), 0 4px 14px rgba(34, 33, 30, 0.06);
  --shadow-float: 0 2px 6px rgba(34, 33, 30, 0.08), 0 14px 38px rgba(34, 33, 30, 0.16);
  --serif: ui-serif, "New York", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141614;
    --card: #201f1c;
    --panel: #262522;
    --panel-strong: #2e2d29;
    --text: #efede6;
    --muted: #98958a;
    --line: rgba(239, 237, 230, 0.11);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    --shadow-float: 0 2px 6px rgba(0, 0, 0, 0.4), 0 14px 38px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  --bg: #141614;
  --card: #201f1c;
  --panel: #262522;
  --panel-strong: #2e2d29;
  --text: #efede6;
  --muted: #98958a;
  --line: rgba(239, 237, 230, 0.11);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  --shadow-float: 0 2px 6px rgba(0, 0, 0, 0.4), 0 14px 38px rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {
  background-color: var(--bg);
  background-image: var(--wall-img, none);
  background-size: cover; background-position: center; background-repeat: no-repeat;
}
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  touch-action: pan-x pan-y;
  background: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:active { opacity: 0.85; }

/* ===== shared ===== */
.fab {
  width: 40px; height: 40px; border-radius: 50%; border: none; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--card); color: var(--text);
  box-shadow: var(--shadow-card);
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.9); }
.fab.accent { color: var(--accent); }
.fab:disabled { opacity: 0.35; transform: none; }

/* ===== hero header ===== */
.hero { padding: calc(env(safe-area-inset-top) + 22px) 20px 18px; }
.hero-top { display: flex; align-items: flex-start; gap: 12px; }
.hero-main { flex: 1; min-width: 0; }
.overline {
  font-size: 11px; font-weight: 800; letter-spacing: 2.5px;
  color: var(--accent); text-transform: uppercase; margin-bottom: 6px;
}
.hero h1 {
  margin: 0; font-family: var(--serif); font-weight: 600;
  font-size: clamp(28px, 7vw, 36px); letter-spacing: -0.5px; line-height: 1.05;
}
.hero-sub { margin-top: 7px; font-size: 13px; color: var(--muted); }
.hero-actions { display: flex; gap: 8px; padding-top: 4px; }

/* ===== home list ===== */
.list { padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.section-label {
  font-size: 11px; font-weight: 800; letter-spacing: 2px;
  color: var(--muted); text-transform: uppercase; padding: 14px 2px 0;
}
.row {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--card); border: none; border-radius: 20px; padding: 14px;
  box-shadow: var(--shadow-card);
  transition: transform 0.15s;
}
.row:active { transform: scale(0.985); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.row-title { font-size: 16px; font-weight: 650; letter-spacing: -0.2px; }
.tile {
  width: 44px; height: 44px; border-radius: 14px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-weight: 750; font-size: 17px; letter-spacing: 0.5px;
}
.chev { color: var(--muted); font-size: 20px; }
.counts { display: flex; gap: 11px; }
.count { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.tip { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 28px 34px; line-height: 1.5; }

/* ===== board ===== */
.board { display: flex; gap: 12px; padding: 10px 20px 130px; overflow-x: auto; align-items: flex-start; }
.column {
  background: var(--panel); border-radius: 22px; padding: 12px;
  flex: 0 0 288px; max-width: 82vw; min-height: 130px;
}
.col-head { display: flex; align-items: center; gap: 7px; padding: 6px 6px 12px; }
.col-head .name { font-family: var(--serif); font-size: 16px; font-weight: 650; letter-spacing: -0.2px; }
.col-head .num {
  font-size: 11px; font-weight: 750; color: var(--muted);
  background: var(--card); border-radius: 999px; padding: 2px 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.07);
}
.col-head .spacer { flex: 1; }
.col-head .clear { border: none; background: transparent; color: var(--accent); font-size: 12px; font-weight: 750; padding: 4px 6px; }
.progress { height: 4px; border-radius: 3px; background: var(--panel-strong); margin: -4px 6px 10px; overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 3px; background: #22a06b; transition: width 0.35s ease; }
.cards { display: flex; flex-direction: column; gap: 9px; }
.empty {
  text-align: center; color: var(--muted); font-size: 12px; padding: 24px 8px;
  border: 1.5px dashed var(--line); border-radius: 14px;
}
.empty svg { display: block; margin: 0 auto 6px; opacity: 0.55; }

.card {
  position: relative; background: var(--card); border-radius: 16px; padding: 12px 12px 12px 16px;
  box-shadow: var(--shadow-card); text-align: left; width: 100%; border: none;
  transition: transform 0.15s;
  overflow: hidden;
}
.card:before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
  width: 3px; border-radius: 2px; background: var(--stripe, var(--muted));
}
.card:active { transform: scale(0.98); }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 750; letter-spacing: 0.3px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px;
}
.chip .dot { width: 5px; height: 5px; }
.card-title { font-size: 14px; font-weight: 560; margin-top: 9px; white-space: pre-wrap; word-break: break-word; }
.card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; color: var(--muted); font-size: 11px; }
.card-menu {
  border: none; background: var(--panel); color: var(--text);
  width: 27px; height: 27px; border-radius: 50%; font-size: 15px; line-height: 1;
}

/* ===== search ===== */
.search {
  display: block; margin-top: 14px; width: 100%; padding: 10px 14px;
  border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; font-size: 16px;
}
.search:focus { outline: none; border-color: var(--accent); }

/* ===== quick add ===== */
.quickbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); }
.listen-hint {
  display: none; align-items: center; gap: 7px; padding: 0 8px 7px;
  color: var(--muted); font-size: 12px; font-weight: 550;
}
.listen-hint .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.2; } }
.quickbar-inner {
  display: flex; gap: 9px; align-items: center;
  background: color-mix(in srgb, var(--card) 82%, transparent);
  -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
  border: 1px solid var(--line); border-radius: 26px; padding: 9px;
  box-shadow: var(--shadow-float);
}
.chip-btn {
  border: none; padding: 8px 11px; border-radius: 999px; font-size: 11px; font-weight: 800;
  letter-spacing: 0.3px; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 5px; flex: none;
}
.quickbar input {
  flex: 1; min-width: 0; border: none; background: transparent; color: var(--text);
  font: inherit; font-size: 16px; padding: 6px 2px; resize: none;
}
.quickbar input:focus { outline: none; }
.round-btn { width: 38px; height: 38px; border-radius: 50%; border: none; flex: none; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
.round-btn:active { transform: scale(0.88); }
.mic { background: var(--accent-soft); color: var(--accent); }
.mic.recording { background: var(--danger); color: #fff; }
.add { background: var(--accent); color: #fff; }
.add:disabled { background: var(--panel-strong); color: var(--muted); }

/* ===== modal sheets ===== */
#modal { position: fixed; inset: 0; z-index: 50; display: none; }
#modal.open { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(20, 18, 14, 0.45); }
.sheet {
  position: absolute; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 560px;
  background: var(--card); border-radius: 26px 26px 0 0; max-height: 88dvh;
  overflow-y: auto; padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
  animation: slide-up 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
}
@keyframes slide-up { from { transform: translateY(48px); opacity: 0.3; } }
.grabber { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 12px; }
.sheet h2 { margin: 0 0 16px; font-family: var(--serif); font-weight: 650; font-size: 22px; letter-spacing: -0.3px; }
.field { margin-bottom: 16px; }
.field > label {
  display: block; font-size: 11px; font-weight: 800; color: var(--muted);
  margin-bottom: 7px; text-transform: uppercase; letter-spacing: 1.5px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font: inherit; font-size: 16px;
}
.field textarea { resize: vertical; min-height: 66px; }
.seg { display: flex; background: var(--panel); border-radius: 13px; padding: 3px; gap: 3px; }
.seg button {
  flex: 1; border: none; border-radius: 10px; padding: 10px 0; background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 700;
}
.seg button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.14); }
.sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; padding: 13px; border-radius: 14px; border: none; font-weight: 750; font-size: 15px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-plain { background: var(--panel); color: var(--text); }
.btn-danger { background: transparent; color: var(--danger); flex: none; }
.action-list { margin: 4px -8px 0; }
.action {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 15px 10px; background: transparent; border: none; border-top: 1px solid var(--line); font-size: 15px; font-weight: 550;
}
.action:first-child { border-top: none; }
.action.destructive { color: var(--danger); }
.action .a-icon { width: 20px; display: inline-flex; justify-content: center; }
.arc-row { display: flex; align-items: center; gap: 10px; padding: 13px 2px; border-bottom: 1px solid var(--line); }
.arc-main { flex: 1; min-width: 0; }
.arc-title { font-size: 14px; font-weight: 560; word-break: break-word; }
.arc-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.small-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 11px; padding: 7px 13px; font-size: 12px; font-weight: 750; flex: none; }
.small-btn.danger { color: var(--danger); }

/* ===== appearance ===== */
.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.swatch {
  position: relative; width: 38px; height: 38px; border-radius: 50%; padding: 0;
  border: 2px solid transparent; background: transparent;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.swatch:active { transform: scale(0.92); }
.swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
.swatch.active { border-color: var(--text); }
.swatch.custom { border-style: dashed; border-color: var(--line); }
.swatch.custom i { width: 24px; height: 24px; }
.field .swatch.custom input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  padding: 0; border: none; border-radius: 50%; opacity: 0; background: transparent;
}
.wp-empty {
  padding: 22px 14px; text-align: center; color: var(--muted);
  font-size: 12.5px; line-height: 1.5;
  border: 1.5px dashed var(--line); border-radius: 16px;
}
.wp-preview {
  position: relative; height: 196px; border-radius: 18px; overflow: hidden;
  border: 1px solid var(--line); background: var(--panel); touch-action: none; margin-bottom: 8px;
}
.wp-preview .p-img {
  position: absolute; inset: -16px;
  background-image: var(--wall-src, none);
  background-size: cover; background-repeat: no-repeat; background-position: 50% 50%;
}
.wp-preview .p-dim { position: absolute; inset: 0; background: var(--bg); opacity: 0.72; }
.wp-preview .p-hint {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  font-size: 9.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
  color: #fff; background: rgba(20, 18, 14, 0.42); padding: 4px 10px; border-radius: 999px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); white-space: nowrap;
}
.wp-preview .p-card {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  background: var(--card); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow-card);
}
.wp-preview .p-title { font-family: var(--serif); font-size: 14px; font-weight: 650; letter-spacing: -0.2px; }
.wp-preview .p-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.range-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; }
.range-row > label {
  width: 46px; flex: none; font-size: 11px; font-weight: 800;
  letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 0;
}
.field .range-row input[type="range"] {
  flex: 1; width: auto; padding: 0; border: none; background: transparent;
  accent-color: var(--accent); height: 28px;
}
.range-row .val { width: 42px; flex: none; text-align: right; font-size: 11px; font-weight: 700; color: var(--muted); }

#toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px); background: #2a2823; color: #f4f2ec;
  padding: 11px 18px; border-radius: 14px; font-size: 13px; font-weight: 550; opacity: 0;
  pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 99;
  max-width: 86vw; text-align: center; box-shadow: var(--shadow-float);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
"use strict";

// ===== constants =====
const KEY = "taskboard.v1";
const CATEGORIES = {
  bug:     { label: "Bug",     color: "#dc4444" },
  update:  { label: "Update",  color: "#d98324" },
  project: { label: "Project", color: "#0d9488" },
  note:    { label: "Note",    color: "#5b5bd6" }
};
const STATUSES = {
  todo:       { label: "To Do",       color: "#3b82f6" },
  inProgress: { label: "In Progress", color: "#f59e0b" },
  done:       { label: "Done",        color: "#22a06b" }
};
const FOCI = {
  thisWeek: { label: "This Week", color: "#d6409f" },
  nextWeek: { label: "Next Week", color: "#8e4ec6" },
  later:    { label: "Later",     color: "#0d9488" },
  someday:  { label: "Someday",   color: "#8b8d98" }
};

const I = {
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

  mic: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21h-2a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.08A7 7 0 0 0 19 11z"/></svg>',
  up: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',

  ghost: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>',
  archive: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>',
  export_: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>',
  restore: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.6-7L3 7.5"/></svg>',
  trash: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20l-5 1 1-5z"/></svg>',
  copy: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  photo: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  palette: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2.2-1 2.2-2 0-1.5-1.4-2-1.3-3.2 0.1-0.9 0.9-1.3 1.9-1.3H17a4 4 0 0 0 4-4c0-4.1-4-7.5-9-7.5z"/><circle cx="7.6" cy="12.4" r="1.1"/><circle cx="9.8" cy="8.4" r="1.1"/><circle cx="14.6" cy="7.8" r="1.1"/></svg>'
};

// ===== state =====
let state = loadState();
const undoStack = [];
let draft = "";
let manualCategory = null;
let boardSearch = "";
let searchActive = false;
let categoryFilter = null;
let focusFilter = null;

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.tasks) && Array.isArray(s.projects)) return s;
    }
  } catch (e) {}
  return { projects: [], tasks: [] };
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
const ACCENTS = ["#0d9488", "#22a06b", "#3b82f6", "#5b5bd6", "#8e4ec6", "#d6409f", "#dc4444", "#d98324", "#eab308", "#64748b"];

const DEFAULT_LOOK = {
  theme: "system", accent: "",
  wall: null, wallDim: 0.72, wallBlur: 0, wallScale: 1, wallX: 50, wallY: 50
};

function appearance() {
  if (!state.app || typeof state.app !== "object") state.app = {};
  const a = state.app;
  if (!a.wall && state.wall) { a.wall = state.wall; state.wall = null; }
  Object.keys(DEFAULT_LOOK).forEach(k => {
    if (a[k] === undefined || (a[k] === null && k !== "wall" && k !== "accent")) a[k] = DEFAULT_LOOK[k];
  });
  a.theme = ["system", "light", "dark"].indexOf(a.theme) >= 0 ? a.theme : "system";
  a.accent = typeof a.accent === "string" ? a.accent : "";
  a.wallDim = clamp(Number(a.wallDim), 0.1, 0.98);
  a.wallBlur = clamp(Number(a.wallBlur) || 0, 0, 40);
  a.wallScale = clamp(Number(a.wallScale) || 1, 1, 4);
  a.wallX = clamp(Number(a.wallX) || 0, 0, 100);
  a.wallY = clamp(Number(a.wallY) || 0, 0, 100);
  return a;
}

function hexToRgba(hex, alpha) {
  let h = String(hex || "").replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  if (h.length !== 6 || isNaN(n)) return "rgba(13, 148, 136, " + alpha + ")";
  return "rgba(" + ((n >> 16) & 255) + ", " + ((n >> 8) & 255) + ", " + (n & 255) + ", " + alpha + ")";
}

let wallImgCache = { src: "", el: null };
let wallComposedKey = "";
let wallComposedUrl = "";
let wallPendingKey = "";

/* Bakes the photo, zoom, focal point, blur and tint into one image that is
   painted as the page's own root background, so it always fills the screen. */
function composeWallpaper(a, img, bg) {
  const maxEdge = 1800;
  const aspect = Math.max(0.2, Math.min(5, window.innerWidth / Math.max(1, window.innerHeight)));
  let W, H;
  if (aspect >= 1) { W = maxEdge; H = Math.round(maxEdge / aspect); }
  else { H = maxEdge; W = Math.round(maxEdge * aspect); }
  W = Math.max(2, W); H = Math.max(2, H);

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  const scale = Math.max(W / img.width, H / img.height) * a.wallScale;
  const dw = img.width * scale;
  const dh = img.height * scale;
  const x = (W - dw) * (a.wallX / 100);
  const y = (H - dh) * (a.wallY / 100);
  ctx.drawImage(img, x, y, dw, dh);

  let out = canvas;
  if (a.wallBlur > 0) {
    const k = Math.max(0.03, 1 / (1 + a.wallBlur * 0.85));
    const small = document.createElement("canvas");
    small.width = Math.max(4, Math.round(W * k));
    small.height = Math.max(4, Math.round(H * k));
    const sctx = small.getContext("2d");
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = "high";
    sctx.drawImage(canvas, 0, 0, small.width, small.height);

    const smooth = document.createElement("canvas");
    smooth.width = W; smooth.height = H;
    const bctx = smooth.getContext("2d");
    bctx.imageSmoothingEnabled = true;
    bctx.imageSmoothingQuality = "high";
    bctx.drawImage(small, 0, 0, W, H);
    out = smooth;
  }

  if (a.wallDim > 0) {
    const octx = out.getContext("2d");
    octx.globalAlpha = a.wallDim;
    octx.fillStyle = bg;
    octx.fillRect(0, 0, W, H);
    octx.globalAlpha = 1;
  }
  return out.toDataURL("image/jpeg", 0.84);
}

function paintWallpaper(a) {
  const root = document.documentElement;
  const bg = (getComputedStyle(root).getPropertyValue("--bg") || "").trim() || "#faf8f4";
  const key = [a.wall.length, a.wallScale, a.wallX, a.wallY, a.wallBlur, a.wallDim, bg, window.innerWidth, window.innerHeight].join("|");
  if (wallComposedKey === key && wallComposedUrl) return;
  if (wallPendingKey === key) return;
  wallPendingKey = key;

  const paint = img => {
    wallPendingKey = "";
    if (appearance().wall !== a.wall) return;
    try {
      const url = composeWallpaper(a, img, bg);
      wallComposedKey = key;
      wallComposedUrl = url;
      root.style.setProperty("--wall-img", 'url("' + url + '")');
    } catch (err) {
      root.style.setProperty("--wall-img", 'url("' + a.wall + '")');
    }
  };

  if (wallImgCache.el && wallImgCache.src === a.wall) { paint(wallImgCache.el); return; }
  const el = new Image();
  el.onload = () => { wallImgCache = { src: a.wall, el: el }; paint(el); };
  el.onerror = () => { wallPendingKey = ""; };
  el.src = a.wall;
}

function applyAppearance() {
  const a = appearance();
  const root = document.documentElement;
  if (a.theme === "light" || a.theme === "dark") root.setAttribute("data-theme", a.theme);
  else root.removeAttribute("data-theme");
  if (a.accent) {
    root.style.setProperty("--accent", a.accent);
    root.style.setProperty("--accent-soft", hexToRgba(a.accent, 0.13));
  } else {
    root.style.removeProperty("--accent");
    root.style.removeProperty("--accent-soft");
  }
  if (a.wall) {
    root.style.setProperty("--wall-src", 'url("' + a.wall + '")');
    paintWallpaper(a);
  } else {
    wallComposedKey = "";
    wallComposedUrl = "";
    root.style.removeProperty("--wall-src");
    root.style.removeProperty("--wall-img");
  }
}
function snapshot() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 30) undoStack.shift();
  updateUndoButtons();
}
function undo() {
  if (!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  save();
  render();
}
function updateUndoButtons() {
  document.querySelectorAll("[data-action='undo']").forEach(b => { b.disabled = !undoStack.length; });
}

// ===== helpers =====
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2));
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });

function projectColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return "hsl(" + h + ", 30%, 46%)";
}
function projectTint(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return "hsla(" + h + ", 30%, 46%, 0.14)";
}

function detectCategory(text) {
  const t = text.toLowerCase();
  const bugWords = ["bug", "fix", "broken", "crash", "error", "issue", "glitch", "fails", "wrong"];
  const updateWords = ["update", "upgrade", "improve", "refresh", "polish", "tweak", "revise", "redo"];
  const projectWords = ["project", "build", "create", "start", "launch", "ship", "feature"];
  if (bugWords.some(w => t.includes(w))) return "bug";
  if (updateWords.some(w => t.includes(w))) return "update";
  if (projectWords.some(w => t.includes(w))) return "project";
  return "note";
}

const activeCategory = () => manualCategory || detectCategory(draft);

const scoped = pid => state.tasks.filter(t => !t.archived && t.projectID === pid);
function visibleTasks(pid) {
  return scoped(pid).filter(t => {
    if (categoryFilter && t.category !== categoryFilter) return false;
    if (focusFilter && t.focus !== focusFilter) return false;
    if (boardSearch && !t.title.toLowerCase().includes(boardSearch.toLowerCase())) return false;
    return true;
  });
}
function countsHtml(pid) {
  const tasks = scoped(pid);
  return '<span class="counts">' + Object.keys(STATUSES).map(k =>
    '<span class="count"><i class="dot" style="background:' + STATUSES[k].color + '"></i>' +
    tasks.filter(t => t.status === k).length + '</span>').join("") + '</span>';
}
const chip = (info, text) =>
  '<span class="chip" style="color:' + info.color + ';background:' + info.color + '1d">' +
  '<i class="dot" style="background:' + info.color + '"></i>' + esc(text) + '</span>';

const greetingSub = () => {
  const open = state.tasks.filter(t => !t.archived && t.status !== "done").length;
  const date = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  return date + " · " + open + " open task" + (open === 1 ? "" : "s");
};

// ===== routing =====
function route() {
  const h = location.hash;
  if (h.startsWith("#board/")) {
    const id = h.slice(7);
    return { view: "board", projectId: id === "general" ? null : id };
  }
  return { view: "home" };
}

function render() {
  applyAppearance();
  const app = document.getElementById("app");
  const r = route();
  if (r.view === "board") {
    if (r.projectId && !state.projects.some(p => p.id === r.projectId)) { location.hash = "#home"; return; }
    renderBoard(app, r.projectId);
  } else {
    renderHome(app);
  }
  updateUndoButtons();
}

// ===== home view =====
function renderHome(app) {
  searchActive = false;
  const rows = [
    '<div class="row">' +
      '<button class="row" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;flex:1;min-width:0" data-action="open-board" data-id="general">' +
        '<span class="tile" style="background:var(--accent-soft);color:var(--accent)">' + I.tray + '</span>' +
        '<span class="row-main"><span class="row-title">General</span>' + countsHtml(null) + '</span>' +
        '<span class="chev">&#8250;</span>' +
      '</button>' +
    '</div>'
  ];
  rows.push('<div class="section-label">Projects</div>');
  if (!state.projects.length) {
    rows.push('<div class="empty" style="padding:14px 10px">No projects yet — tap + to add one.</div>');
  }
  state.projects.forEach(p => {
    const pc = projectColor(p.name);
    rows.push(
      '<div class="row" style="padding-right:8px">' +
        '<button class="row" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;flex:1;min-width:0" data-action="open-board" data-id="' + p.id + '">' +
          '<span class="tile" style="background:' + projectTint(p.name) + ';color:' + pc + '">' + esc(p.name.trim().charAt(0).toUpperCase() || "?") + '</span>' +
          '<span class="row-main"><span class="row-title">' + esc(p.name) + '</span>' + countsHtml(p.id) + '</span>' +
          '<span class="chev">&#8250;</span>' +
        '</button>' +
        '<button class="fab" data-action="project-menu" data-id="' + p.id + '" style="width:34px;height:34px">' + I.dots + '</button>' +
      '</div>');
  });
  app.innerHTML =
    '<header class="hero">' +
      '<div class="hero-top">' +
        '<div class="hero-main">' +
          '<div class="overline">Task Board</div>' +
          '<h1>My Boards</h1>' +
          '<div class="hero-sub">' + esc(greetingSub()) + '</div>' +
        '</div>' +
        '<div class="hero-actions">' +
          '<button class="fab" data-action="undo" title="Undo">' + I.undo + '</button>' +
          '<button class="fab accent" data-action="new-project" title="New project">' + I.plus + '</button>' +
          '<button class="fab" data-action="home-menu" title="More">' + I.dots + '</button>' +
        '</div>' +
      '</div>' +
    '</header>' +
    '<div class="list">' + rows.join("") + '</div>' +
    '<div class="tip">In Safari, use Share &rarr; Add to Home Screen to pin Task Board to your home screen.</div>';
}

// ===== board view =====
function renderBoard(app, projectId) {
  const project = projectId ? state.projects.find(p => p.id === projectId) : null;
  const title = project ? project.name : "General";
  const tasks = visibleTasks(projectId);
  const scopedAll = scoped(projectId);
  const activeFilters = !!(categoryFilter || focusFilter || boardSearch);

  const columns = Object.keys(STATUSES).map(sk => {
    const items = tasks.filter(t => t.status === sk);
    const doneShare = scopedAll.length ? Math.round(scopedAll.filter(t => t.status === "done").length * 100 / scopedAll.length) : 0;
    const cards = items.map(t => {
      const c = CATEGORIES[t.category] || CATEGORIES.note;
      const f = t.focus ? FOCI[t.focus] : null;
      return (
        '<div class="card" data-action="open-task" data-id="' + t.id + '" style="--stripe:' + c.color + '">' +
          '<div class="chip-row">' + chip(c, c.label) + (f ? chip(f, f.label) : "") + '</div>' +
          '<div class="card-title">' + esc(t.title) + '</div>' +
          '<div class="card-foot"><span>' + fmtDate(t.createdAt) + '</span>' +
          '<button class="card-menu" data-action="task-menu" data-id="' + t.id + '">&#8943;</button></div>' +
        '</div>');
    }).join("");
    return (
      '<div class="column">' +
        '<div class="col-head">' +
          '<i class="dot" style="background:' + STATUSES[sk].color + '"></i>' +
          '<span class="name">' + STATUSES[sk].label + '</span>' +
          '<span class="num">' + items.length + '</span>' +
          '<span class="spacer"></span>' +
          (sk === "done" && items.length
            ? '<button class="clear" data-action="clear-done" data-pid="' + (projectId || "") + '">Clear</button>'
            : "") +
        '</div>' +
        (sk === "done" ? '<div class="progress"><i style="width:' + doneShare + '%"></i></div>' : "") +
        '<div class="cards">' +
          (cards || '<div class="empty">' + I.ghost + 'Nothing here yet</div>') +
        '</div>' +
      '</div>');
  }).join("");

  const cat = CATEGORIES[activeCategory()];
  app.innerHTML =
    '<header class="hero">' +
      '<div class="hero-top">' +
        '<button class="fab" data-action="go-home" title="Back">' + I.back + '</button>' +
        '<div class="hero-main">' +
          '<div class="overline">Board</div>' +
          '<h1>' + esc(title) + '</h1>' +
          '<div class="hero-sub">' + esc(greetingSub()) + '</div>' +
        '</div>' +
        '<div class="hero-actions">' +
          '<button class="fab" data-action="undo" title="Undo">' + I.undo + '</button>' +
          '<button class="fab' + (activeFilters ? " accent" : "") + '" data-action="open-filters" title="Filters">' + I.filter + '</button>' +
        '</div>' +
      '</div>' +
      '<input id="searchInput" class="search" type="search" placeholder="Search tasks" value="' + esc(boardSearch) + '">' +
    '</header>' +
    '<div class="board">' + columns + '</div>' +
    '<div class="quickbar">' +
      '<div class="listen-hint" id="listenHint"><span class="pulse"></span>Listening&hellip; tap the mic to stop</div>' +
      '<div class="quickbar-inner">' +
        '<button class="chip-btn" id="catChip" data-action="cycle-category" style="color:' + cat.color + ';background:' + cat.color + '1d">' +
          '<i class="dot" style="background:' + cat.color + '"></i><span>' + cat.label + '</span>' +
        '</button>' +
        '<input id="draftInput" type="text" placeholder="Add a task&hellip;" value="' + esc(draft) + '" autocomplete="off">' +
        '<button class="round-btn mic' + (isListening ? " recording" : "") + '" id="micBtn" data-action="toggle-mic" title="Dictate">' + I.mic + '</button>' +
        '<button class="round-btn add" id="addBtn" data-action="add-task" title="Add"' + (draft.trim() ? "" : " disabled") + '>' + I.up + '</button>' +
      '</div>' +
    '</div>';

  const input = document.getElementById("draftInput");
  input.addEventListener("input", e => {
    draft = e.target.value;
    document.getElementById("addBtn").disabled = !draft.trim();
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addTask(projectId); }
  });
  input.addEventListener("blur", () => { draft = input.value; });
  const search = document.getElementById("searchInput");
  search.addEventListener("input", e => {
    boardSearch = e.target.value;
    searchActive = true;
    render();
  });
  if (searchActive) {
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
  } else {
    boardSearch = "";
  }
  input.focus();
}

// ===== modals =====
function showModal(html, wire) {
  const modal = document.getElementById("modal");
  modal.innerHTML = '<div class="backdrop" data-close="1"></div><div class="sheet"><div class="grabber"></div>' + html + '</div>';
  modal.classList.add("open");
  modal.querySelector(".backdrop").addEventListener("click", closeModal);
  if (wire) wire(modal);
}
function closeModal() {
  const modal = document.getElementById("modal");
  modal.classList.remove("open");
  modal.innerHTML = "";
}

function openTaskModal(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;
  const d = { title: t.title, status: t.status, category: t.category, projectID: t.projectID || "", focus: t.focus || "" };
  const projectOptions = ['<option value=""' + (d.projectID === "" ? " selected" : "") + '>General</option>']
    .concat(state.projects.map(p => '<option value="' + p.id + '"' + (p.id === d.projectID ? " selected" : "") + '>' + esc(p.name) + '</option>'))
    .join("");
  const focusOptions = ['<option value=""' + (d.focus === "" ? " selected" : "") + '>None</option>']
    .concat(Object.keys(FOCI).map(k => '<option value="' + k + '"' + (k === d.focus ? " selected" : "") + '>' + FOCI[k].label + '</option>'))
    .join("");
  const seg = (key, defs, current) =>
    '<div class="seg">' + Object.keys(defs).map(k =>
      '<button type="button" data-seg="' + key + '" data-val="' + k + '" class="' + (current === k ? "active" : "") + '">' + defs[k].label + '</button>'
    ).join("") + '</div>';

  showModal(
    '<h2>Edit Task</h2>' +
    '<div class="field"><label>Title</label><textarea id="tmTitle">' + esc(d.title) + '</textarea></div>' +
    '<div class="field"><label>Status</label>' + seg("status", STATUSES, d.status) + '</div>' +
    '<div class="field"><label>Board</label><select id="tmProject">' + projectOptions + '</select></div>' +
    '<div class="field"><label>Category</label>' + seg("category", CATEGORIES, d.category) + '</div>' +
    '<div class="field"><label>Focus</label><select id="tmFocus">' + focusOptions + '</select></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-danger" id="tmDelete">Delete</button>' +
      '<button class="btn btn-primary" id="tmDone">Done</button>' +
    '</div>',
    modal => {
      modal.querySelector("#tmTitle").addEventListener("input", e => { d.title = e.target.value; });
      modal.querySelectorAll("[data-seg]").forEach(b => b.addEventListener("click", () => {
        d[b.dataset.seg] = b.dataset.val;
        modal.querySelectorAll('[data-seg="' + b.dataset.seg + '"]').forEach(x => x.classList.toggle("active", x === b));
      }));
      modal.querySelector("#tmProject").addEventListener("change", e => { d.projectID = e.target.value || null; });
      modal.querySelector("#tmFocus").addEventListener("change", e => { d.focus = e.target.value || null; });
      modal.querySelector("#tmDelete").addEventListener("click", () => deleteTask(t.id));
      modal.querySelector("#tmDone").addEventListener("click", () => {
        snapshot();
        t.title = d.title.trim() || t.title;
        t.status = d.status;
        t.category = d.category;
        t.projectID = d.projectID;
        t.focus = d.focus;
        save();
        closeModal();
        render();
      });
    });
}

function openTaskSheet(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;
  const moves = Object.keys(STATUSES).filter(k => k !== t.status).map(k =>
    '<button class="action" data-moveto="' + k + '"><span class="a-icon"><i class="dot" style="background:' + STATUSES[k].color + '"></i></span>Move to ' + STATUSES[k].label + '</button>'
  ).join("");
  showModal(
    '<h2>' + esc(t.title) + '</h2>' +
    '<div class="action-list">' + moves +
      '<button class="action" data-sheet="duplicate"><span class="a-icon">' + I.copy + '</span>Duplicate</button>' +
      '<button class="action" data-sheet="edit"><span class="a-icon">' + I.pencil + '</span>Edit details</button>' +
      '<button class="action destructive" data-sheet="delete"><span class="a-icon">' + I.trash + '</span>Delete</button>' +
    '</div>',
    modal => {
      modal.querySelectorAll("[data-moveto]").forEach(b => b.addEventListener("click", () => {
        snapshot();
        t.status = b.dataset.moveto;
        save(); closeModal(); render();
      }));
      modal.querySelector('[data-sheet="duplicate"]').addEventListener("click", () => duplicateTask(t.id));
      modal.querySelector('[data-sheet="edit"]').addEventListener("click", () => openTaskModal(t.id));
      modal.querySelector('[data-sheet="delete"]').addEventListener("click", () => deleteTask(t.id));
    });
}

function openProjectModal(project, isRename) {
  showModal(
    '<h2>' + (isRename ? "Rename Project" : "New Project") + '</h2>' +
    '<div class="field"><label>Project name</label><input id="pjName" type="text" placeholder="Project name" value="' + esc(project ? project.name : "") + '"></div>' +
    '<div class="sheet-actions"><button class="btn btn-primary" id="pjSave">' + (isRename ? "Save" : "Create") + '</button></div>',
    modal => {
      const input = modal.querySelector("#pjName");
      input.focus();
      input.addEventListener("keydown", e => { if (e.key === "Enter") modal.querySelector("#pjSave").click(); });
      modal.querySelector("#pjSave").addEventListener("click", () => {
        const name = input.value.trim();
        if (!name) { toast("Give the project a name first"); return; }
        if (isRename) {
          snapshot();
          project.name = name;
        } else {
          snapshot();
          state.projects.push({ id: uid(), name: name, createdAt: Date.now() });
        }
        save();
        closeModal();
        render();
      });
    });
}

function openProjectSheet(projectId) {
  const p = state.projects.find(x => x.id === projectId);
  if (!p) return;
  showModal(
    '<h2>' + esc(p.name) + '</h2>' +
    '<div class="action-list">' +
      '<button class="action" data-pj="rename"><span class="a-icon">' + I.pencil + '</span>Rename</button>' +
      '<button class="action destructive" data-pj="del-keep"><span class="a-icon">' + I.trash + '</span>Delete project, move tasks to General</button>' +
      '<button class="action destructive" data-pj="del-tasks"><span class="a-icon">' + I.trash + '</span>Delete project and its tasks</button>' +
    '</div>',
    modal => {
      modal.querySelector('[data-pj="rename"]').addEventListener("click", () => openProjectModal(p, true));
      modal.querySelector('[data-pj="del-keep"]').addEventListener("click", () => deleteProject(p.id, false));
      modal.querySelector('[data-pj="del-tasks"]').addEventListener("click", () => deleteProject(p.id, true));
    });
}

function openFilterSheet() {
  const catOptions = ['<option value=""' + (!categoryFilter ? " selected" : "") + '>All categories</option>']
    .concat(Object.keys(CATEGORIES).map(k => '<option value="' + k + '"' + (k === categoryFilter ? " selected" : "") + '>' + CATEGORIES[k].label + '</option>'))
    .join("");
  const focusOptions = ['<option value=""' + (!focusFilter ? " selected" : "") + '>Any time</option>']
    .concat(Object.keys(FOCI).map(k => '<option value="' + k + '"' + (k === focusFilter ? " selected" : "") + '>' + FOCI[k].label + '</option>'))
    .join("");
  showModal(
    '<h2>Filters</h2>' +
    '<div class="field"><label>Category</label><select id="fCat">' + catOptions + '</select></div>' +
    '<div class="field"><label>Focus</label><select id="fFocus">' + focusOptions + '</select></div>' +
    '<div class="sheet-actions"><button class="btn btn-plain" id="fClear">Clear</button><button class="btn btn-primary" id="fApply">Apply</button></div>',
    modal => {
      modal.querySelector("#fApply").addEventListener("click", () => {
        categoryFilter = modal.querySelector("#fCat").value || null;
        focusFilter = modal.querySelector("#fFocus").value || null;
        closeModal();
        render();
      });
      modal.querySelector("#fClear").addEventListener("click", () => {
        categoryFilter = null; focusFilter = null; boardSearch = "";
        closeModal(); render();
      });
    });
}

function openArchive() {
  const archived = state.tasks.filter(t => t.archived);
  const rows = archived.length
    ? archived.map(t => {
        const projName = t.projectID
          ? (state.projects.find(p => p.id === t.projectID) || {}).name || "General"
          : "General";
        return (
          '<div class="arc-row"><div class="arc-main">' +
            '<div class="arc-title">' + esc(t.title) + '</div>' +
            '<div class="arc-meta">' + CATEGORIES[t.category].label + ' · ' + STATUSES[t.status].label + ' · ' + esc(projName) + '</div>' +
          '</div>' +
          '<button class="small-btn" data-action="restore" data-id="' + t.id + '">Restore</button>' +
          '<button class="small-btn danger" data-action="purge" data-id="' + t.id + '">Delete</button></div>');
      }).join("")
    : '<div class="empty" style="padding:18px 10px">Tasks you clear from the Done column land here.</div>';
  showModal('<h2>Archive</h2>' + rows, () => {});
}

function openHomeMenu() {
  showModal(
    '<h2>More</h2>' +
    '<div class="action-list">' +
      '<button class="action" data-hm="look"><span class="a-icon">' + I.palette + '</span>Appearance &amp; wallpaper</button>' +
      '<button class="action" data-hm="archive"><span class="a-icon">' + I.archive + '</span>Archive</button>' +
      '<button class="action" data-hm="md"><span class="a-icon">' + I.export_ + '</span>Export as Markdown</button>' +
      '<button class="action" data-hm="backup"><span class="a-icon">' + I.export_ + '</span>Download backup (.json)</button>' +
      '<button class="action" data-hm="restore"><span class="a-icon">' + I.restore + '</span>Restore backup</button>' +
    '</div>' +
    '<input type="file" id="importFile" accept=".json,application/json" style="display:none">',
    modal => {
      modal.querySelector('[data-hm="look"]').addEventListener("click", openAppearanceSheet);
      modal.querySelector('[data-hm="archive"]').addEventListener("click", openArchive);
      modal.querySelector('[data-hm="md"]').addEventListener("click", () => {
        download("task-board.md", exportMarkdown(), "text/markdown");
        closeModal();
      });
      modal.querySelector('[data-hm="backup"]').addEventListener("click", () => {
        download("task-board-backup.json", JSON.stringify(state, null, 2), "application/json");
        closeModal();
      });
      const fileInput = modal.querySelector("#importFile");
      modal.querySelector('[data-hm="restore"]').addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!parsed || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.projects)) throw new Error("bad");
            snapshot();
            state = parsed;
            save();
            closeModal();
            render();
            toast("Backup restored");
          } catch (e) {
            toast("That file isn't a Task Board backup");
          }
        };
        reader.readAsText(file);
      });
    });
}

function openAppearanceSheet() {
  const a = appearance();
  const before = JSON.stringify(state);
  let touched = false;

  const mark = () => {
    if (touched) return;
    touched = true;
    undoStack.push(before);
    if (undoStack.length > 30) undoStack.shift();
    updateUndoButtons();
  };
  const commit = () => { mark(); save(); applyAppearance(); };

  const hasWall = !!a.wall;
  const swatches = ACCENTS.map(c =>
    '<button class="swatch' + (a.accent === c ? " active" : "") + '" data-accent="' + c + '">' +
      '<i style="background:' + c + '"></i>' +
    '</button>'
  ).join("");

  const themeSeg = ["system", "light", "dark"].map(k =>
    '<button type="button" data-theme-val="' + k + '"' + (a.theme === k ? ' class="active"' : "") + '>' +
      (k === "system" ? "System" : k === "light" ? "Light" : "Dark") +
    '</button>'
  ).join("");

  const wallBlock = hasWall
    ? '<div class="wp-preview" id="wpPreview">' +
        '<div class="p-img" id="pImg"></div>' +
        '<div class="p-dim" id="pDim"></div>' +
        '<div class="p-hint">Drag photo to reframe</div>' +
        '<div class="p-card"><div class="p-title">Task Board</div>' +
          '<div class="p-sub">Sample card over your photo</div></div>' +
      '</div>' +
      '<div class="range-row"><label>Zoom</label>' +
        '<input type="range" id="apZoom" min="100" max="230" step="1" value="' + Math.round(a.wallScale * 100) + '">' +
        '<span class="val" id="apZoomV">' + (Math.round(a.wallScale * 10) / 10).toFixed(1) + '&times;</span></div>' +
      '<div class="range-row"><label>Dim</label>' +
        '<input type="range" id="apDim" min="15" max="95" step="1" value="' + Math.round(a.wallDim * 100) + '">' +
        '<span class="val" id="apDimV">' + Math.round(a.wallDim * 100) + '%</span></div>' +
      '<div class="range-row"><label>Blur</label>' +
        '<input type="range" id="apBlur" min="0" max="16" step="1" value="' + Math.round(a.wallBlur) + '">' +
        '<span class="val" id="apBlurV">' + Math.round(a.wallBlur) + 'px</span></div>' +
      '<div class="sheet-actions" style="margin-top:2px">' +
        '<button class="btn btn-plain" id="apChange">Change photo</button>' +
        '<button class="btn btn-plain" id="apRemove">Remove</button>' +
      '</div>'
    : '<div class="wp-empty">No wallpaper yet — pick a photo from your library. It stays on this device, never uploaded.</div>' +
      '<div class="sheet-actions"><button class="btn btn-plain" id="apChoose">Choose photo</button></div>';

  showModal(
    '<h2>Appearance</h2>' +
    '<div class="field"><label>Accent color</label><div class="swatches">' +
      swatches +
      '<label class="swatch custom" title="Custom color">' +
        '<i style="background:' + (a.accent || "linear-gradient(135deg, #dc4444, #d97706, #22a06b, #0d6fb8, #6366f1, #d6409f)") + '"></i>' +
        '<input type="color" id="apCustom" value="' + (a.accent || ACCENTS[0]) + '">' +
      '</label>' +
    '</div></div>' +
    '<div class="field"><label>Appearance</label><div class="seg">' + themeSeg + '</div></div>' +
    '<div class="field"><label>Wallpaper</label>' + wallBlock + '</div>' +
    '<div class="action-list"><button class="action" id="apReset"><span class="a-icon">' + I.palette + '</span>Reset look to defaults</button></div>' +
    '<input type="file" id="wallFile" accept="image/*" style="display:none">' +
    '<div class="sheet-actions"><button class="btn btn-primary" id="apClose">Done</button></div>',
    modal => {
      const fileInput = modal.querySelector("#wallFile");
      const pick = () => fileInput.click();

      modal.querySelectorAll("[data-accent]").forEach(b => b.addEventListener("click", () => {
        a.accent = b.dataset.accent;
        modal.querySelectorAll("[data-accent]").forEach(x => x.classList.toggle("active", x === b));
        const chip = modal.querySelector("#apCustom").parentNode.querySelector("i");
        if (chip) chip.style.background = a.accent;
        commit();
      }));

      const custom = modal.querySelector("#apCustom");
      if (custom) custom.addEventListener("input", () => {
        a.accent = custom.value;
        modal.querySelectorAll("[data-accent]").forEach(x => x.classList.toggle("active", x.dataset.accent === a.accent));
        const chip = custom.parentNode.querySelector("i");
        if (chip) chip.style.background = a.accent;
        commit();
      });

      modal.querySelectorAll("[data-theme-val]").forEach(b => b.addEventListener("click", () => {
        a.theme = b.dataset.themeVal;
        modal.querySelectorAll("[data-theme-val]").forEach(x => x.classList.toggle("active", x === b));
        commit();
      }));

      const preview = modal.querySelector("#wpPreview");
      if (preview) {
        const imgEl = modal.querySelector("#pImg");
        const dimEl = modal.querySelector("#pDim");
        const paint = () => {
          if (imgEl) {
            imgEl.style.backgroundPosition = a.wallX + "% " + a.wallY + "%";
            imgEl.style.transformOrigin = a.wallX + "% " + a.wallY + "%";
            imgEl.style.transform = "scale(" + a.wallScale + ")";
            imgEl.style.filter = a.wallBlur > 0 ? "blur(" + a.wallBlur + "px)" : "none";
          }
          if (dimEl) dimEl.style.opacity = String(a.wallDim);
        };
        paint();

        let drag = null;
        preview.addEventListener("pointerdown", e => {
          drag = { x: e.clientX, y: e.clientY, ox: a.wallX, oy: a.wallY };
          try { preview.setPointerCapture(e.pointerId); } catch (err) {}
          e.preventDefault();
        });
        preview.addEventListener("pointermove", e => {
          if (!drag) return;
          const w = preview.clientWidth || 1;
          const h = preview.clientHeight || 1;
          a.wallX = Math.round(clamp(drag.ox - ((e.clientX - drag.x) / w) * 100, 0, 100));
          a.wallY = Math.round(clamp(drag.oy - ((e.clientY - drag.y) / h) * 100, 0, 100));
          paint();
        });
        const endDrag = () => { if (!drag) return; drag = null; commit(); };
        preview.addEventListener("pointerup", endDrag);
        preview.addEventListener("pointercancel", endDrag);

        const zoom = modal.querySelector("#apZoom");
        zoom.addEventListener("input", () => {
          a.wallScale = Number(zoom.value) / 100;
          const out = modal.querySelector("#apZoomV");
          if (out) out.textContent = a.wallScale.toFixed(1) + "\u00d7";
          paint();
        });
        zoom.addEventListener("change", commit);

        const dim = modal.querySelector("#apDim");
        dim.addEventListener("input", () => {
          a.wallDim = Number(dim.value) / 100;
          const out = modal.querySelector("#apDimV");
          if (out) out.textContent = Math.round(a.wallDim * 100) + "%";
          paint();
        });
        dim.addEventListener("change", commit);

        const blur = modal.querySelector("#apBlur");
        blur.addEventListener("input", () => {
          a.wallBlur = Number(blur.value);
          const out = modal.querySelector("#apBlurV");
          if (out) out.textContent = Math.round(a.wallBlur) + "px";
          paint();
        });
        blur.addEventListener("change", commit);

        modal.querySelector("#apRemove").addEventListener("click", () => {
          a.wall = null;
          commit();
          openAppearanceSheet();
          toast("Wallpaper removed");
        });
        modal.querySelector("#apChange").addEventListener("click", pick);
      } else {
        modal.querySelector("#apChoose").addEventListener("click", pick);
      }

      modal.querySelector("#apReset").addEventListener("click", () => {
        mark();
        state.app = Object.assign({}, DEFAULT_LOOK);
        save();
        applyAppearance();
        openAppearanceSheet();
        toast("Appearance reset");
      });

      modal.querySelector("#apClose").addEventListener("click", closeModal);

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            a.wall = compressImage(img, 1600, 0.74);
            a.wallX = 50;
            a.wallY = 50;
            if (!(a.wallScale >= 1)) a.wallScale = 1;
            commit();
            openAppearanceSheet();
            toast("Wallpaper set \u2014 drag it to reframe");
          };
          img.onerror = () => toast("That image could not be loaded");
          img.src = reader.result;
        };
        reader.onerror = () => toast("That file could not be read");
        reader.readAsDataURL(file);
      });
    });
}

function compressImage(img, maxEdge, quality) {
  const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  let url = canvas.toDataURL("image/jpeg", quality);
  if (url.length > 1800000) {
    const canvas2 = document.createElement("canvas");
    canvas2.width = Math.round(w * 0.7); canvas2.height = Math.round(h * 0.7);
    canvas2.getContext("2d").drawImage(canvas, 0, 0, canvas2.width, canvas2.height);
    url = canvas2.toDataURL("image/jpeg", 0.55);
  }
  return url;
}

// ===== actions =====
function addTask(projectId) {
  const title = draft.trim();
  if (!title) return;
  snapshot();
  state.tasks.unshift({
    id: uid(), title: title,
    category: activeCategory(), status: "todo",
    projectID: projectId, focus: null,
    archived: false, createdAt: Date.now()
  });
  draft = "";
  manualCategory = null;
  save();
  render();
}
function deleteTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  snapshot();
  state.tasks = state.tasks.filter(x => x.id !== id);
  save();
  closeModal();
  render();
  toast("Deleted — tap undo to restore");
}
function duplicateTask(task) {
  snapshot();
  const copy = {
    id: uid(), title: task.title, category: task.category, status: task.status,
    projectID: task.projectID, focus: task.focus, archived: false, createdAt: Date.now()
  };
  const idx = state.tasks.findIndex(x => x.id === task.id);
  state.tasks.splice(idx < 0 ? 0 : idx + 1, 0, copy);
  save();
  closeModal();
  render();
  toast("Task duplicated");
}
function clearDone(projectId) {
  const targets = state.tasks.filter(t => !t.archived && t.status === "done" && t.projectID === projectId);
  if (!targets.length) return;
  snapshot();
  targets.forEach(t => { t.archived = true; });
  save();
  render();
  toast("Archived " + targets.length + " task" + (targets.length === 1 ? "" : "s") + " — undo available");
}
function restoreTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  snapshot();
  t.archived = false;
  save();
  closeModal();
  render();
}
function purgeTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  snapshot();
  state.tasks = state.tasks.filter(x => x.id !== id);
  save();
  closeModal();
  render();
}
function deleteProject(id, deleteTasks) {
  snapshot();
  state.projects = state.projects.filter(p => p.id !== id);
  if (deleteTasks) {
    state.tasks = state.tasks.filter(t => t.projectID !== id);
  } else {
    state.tasks.forEach(t => { if (t.projectID === id) t.projectID = null; });
  }
  save();
  closeModal();
  if (location.hash !== "#home") { location.hash = "#home"; } else { render(); }
}
function cycleCategory() {
  const order = Object.keys(CATEGORIES);
  if (manualCategory) {
    const i = order.indexOf(manualCategory);
    manualCategory = i === order.length - 1 ? null : order[i + 1];
  } else {
    manualCategory = order[0];
  }
  const cat = CATEGORIES[activeCategory()];
  const chipEl = document.getElementById("catChip");
  if (chipEl) {
    chipEl.style.color = cat.color;
    chipEl.style.background = cat.color + "1d";
    chipEl.querySelector("i").style.background = cat.color;
    chipEl.querySelector("span").textContent = cat.label;
  }
}

// ===== export =====
function exportMarkdown() {
  const lines = ["# Task Board", ""];
  const writeBoard = (name, pid) => {
    const active = state.tasks.filter(t => !t.archived && t.projectID === pid);
    if (!active.length) return;
    lines.push("## " + name, "");
    Object.keys(STATUSES).forEach(sk => {
      const items = active.filter(t => t.status === sk);
      if (!items.length) return;
      lines.push("### " + STATUSES[sk].label);
      items.forEach(t => lines.push("- [" + (sk === "done" ? "x" : " ") + "] " + t.title + " (" + CATEGORIES[t.category].label + ")"));
      lines.push("");
    });
  };
  writeBoard("General", null);
  state.projects.forEach(p => writeBoard(p.name, p.id));
  return lines.join("\n");
}
function download(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ===== voice =====
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

function setListening(b) {
  isListening = b;
  const hint = document.getElementById("listenHint");
  const mic = document.getElementById("micBtn");
  if (hint) hint.style.display = b ? "flex" : "none";
  if (mic) mic.classList.toggle("recording", b);
}
function toggleMic() {
  if (!SpeechRec) {
    toast("Voice input needs Safari or Chrome — or tap the mic on your keyboard to dictate");
    return;
  }
  if (isListening) { recognition.stop(); return; }
  recognition = new SpeechRec();
  recognition.lang = navigator.language || "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;
  let finalText = "";
  recognition.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += text + " ";
      else interim += text;
    }
    draft = (finalText + interim).trim();
    const input = document.getElementById("draftInput");
    if (input) {
      input.value = draft;
      document.getElementById("addBtn").disabled = !draft.trim();
    }
  };
  recognition.onend = () => setListening(false);
  recognition.onerror = e => {
    setListening(false);
    if (e.error && e.error !== "aborted" && e.error !== "no-speech") toast("Listening stopped: " + e.error);
  };
  try {
    recognition.start();
    setListening(true);
  } catch (err) {
    toast("Couldn't start listening");
  }
}

// ===== toast =====
let toastTimer = null;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// ===== global events =====
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const r = route();
  const pid = r.view === "board" ? r.projectId : null;
  switch (el.dataset.action) {
    case "open-board":
      location.hash = "#board/" + el.dataset.id;
      break;
    case "go-home":
      categoryFilter = null; focusFilter = null; boardSearch = ""; searchActive = false;
      location.hash = "#home";
      break;
    case "undo": undo(); break;
    case "new-project": openProjectModal(null, false); break;
    case "home-menu": openHomeMenu(); break;
    case "project-menu": openProjectSheet(el.dataset.id); break;
    case "open-task": openTaskModal(el.dataset.id); break;
    case "task-menu": openTaskSheet(el.dataset.id); break;
    case "add-task": addTask(pid); break;
    case "cycle-category": cycleCategory(); break;
    case "toggle-mic": toggleMic(); break;
    case "clear-done": clearDone(el.dataset.pid || null); break;
    case "open-filters": openFilterSheet(); break;
    case "restore": restoreTask(el.dataset.id); break;
    case "purge": purgeTask(el.dataset.id); break;
  }
});
window.addEventListener("hashchange", () => {
  if (isListening && recognition) recognition.stop();
  categoryFilter = null;
  focusFilter = null;
  boardSearch = "";
  searchActive = false;
  render();
});

// ===== boot =====
document.addEventListener("gesturestart", e => e.preventDefault());

let wallResizeTimer = null;
let wallLastAspect = window.innerWidth / Math.max(1, window.innerHeight);
window.addEventListener("resize", () => {
  const aspect = window.innerWidth / Math.max(1, window.innerHeight);
  if (Math.abs(aspect - wallLastAspect) < 0.08) return;
  wallLastAspect = aspect;
  clearTimeout(wallResizeTimer);
  wallResizeTimer = setTimeout(() => { wallComposedKey = ""; applyAppearance(); }, 250);
});

applyAppearance();
render();
